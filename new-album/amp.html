  <style amp-custom>
  :root{
    --cyan:#e7a71d;
    --cyan-soft:#baffcf;
    --blue:#a36c07;
    --blue-deep:#a0710c;
    --ice:#effff5;
    --dark:#010b06;
    --panel:#052218;
    --panel-light:#4a360a;
  }

  *{
    box-sizing:border-box;
  }

  html{
    min-height:100%;
    background:#010b06;
  }

  body{
    margin:0;
    min-height:100vh;

    color:#ffffff;
    font-family:Arial,Helvetica,sans-serif;

    background:
      radial-gradient(
        circle at 50% -8%,
        rgba(255, 202, 57, 0.2),
        transparent 36%
      ),
      radial-gradient(
        circle at 0 78%,
        rgba(201, 152, 17, 0.16),
        transparent 43%
      ),
      radial-gradient(
        circle at 100% 72%,
        rgba(255, 219, 57, 0.1),
        transparent 39%
      ),
      linear-gradient(
        180deg,
        #130d02 0%,
        #2b2106 48%,
        #0b0801 100%
      );

    background-attachment:fixed;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  .page-wrapper{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    max-width:480px;
    min-height:100vh;

    margin:0 auto;
    padding:24px 16px;
  }

  /* =====================================================
     OUTER FRAME
  ===================================================== */

  .silver-frame{
    position:relative;
    isolation:isolate;

    width:100%;
    padding:2px;

    border-radius:24px;

    background:
      linear-gradient(
        135deg,
        #ffffff 0%,
        #d0ffe0 15%,
        #e7a71d 30%,
        #a36c07 48%,
        #ffffff 62%,
        #e6b821 82%,
        #ffffff 100%
      );

    background-size:240% 240%;

    box-shadow:
      0 0 12px rgba(255,255,255,.30),
      0 0 30px rgba(223, 142, 22, 0.3),
      0 0 55px rgba(197, 148, 14, 0.17),
      0 28px 75px rgba(0,0,0,.68);

    animation:reactorBorder 7s ease infinite;
  }

  .silver-frame::before{
    content:"";

    position:absolute;
    inset:-2px;
    z-index:-1;

    border-radius:26px;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(236, 181, 30, 0.72),
        transparent
      );

    filter:blur(10px);
    opacity:.52;
  }

  /* =====================================================
     MAIN PANEL
  ===================================================== */

  .main-panel{
    position:relative;
    isolation:isolate;
    overflow:hidden;

    padding:28px 21px 21px;

    border-radius:22px;

    background:
      radial-gradient(
        circle at 50% -10%,
        rgba(231, 162, 33, 0.16),
        transparent 38%
      ),
      radial-gradient(
        circle at 8% 82%,
        rgba(201, 127, 17, 0.11),
        transparent 40%
      ),
      linear-gradient(
        160deg,
        #402d0a 0%,
        #061f13 48%,
        #010b06 100%
      );

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 0 28px rgba(212, 132, 26, 0.09),
      inset 0 0 80px rgba(196, 136, 9, 0.05);
  }

  /* Clean inner glow, tanpa garis sudut */
  .main-panel::before{
    content:"";

    position:absolute;
    inset:0;
    z-index:0;

    border:1px solid rgba(255,255,255,.06);
    border-radius:inherit;

    pointer-events:none;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.025),
        transparent 24%,
        transparent 75%,
        rgba(233, 194, 21, 0.025)
      );

    box-shadow:
      inset 0 0 24px rgba(255, 186, 57, 0.06),
      inset 0 0 60px rgba(201, 158, 17, 0.04);
  }

  /* Laser sweep */
  .main-panel::after{
    content:"";

    position:absolute;
    top:-90%;
    bottom:-90%;
    left:-55%;
    z-index:1;

    width:28%;

    pointer-events:none;

    background:
      linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.03),
        rgba(224, 160, 20, 0.2),
        rgba(255,255,255,.08),
        transparent
      );

    transform:skewX(-22deg);

    animation:panelLaser 7s linear infinite;
  }

  /* =====================================================
     LOGO
  ===================================================== */

  .logo-section{
    position:relative;
    z-index:3;

    padding:5px 10px 24px;

    text-align:center;
  }

  .logo-link{
    display:inline-block;

    text-decoration:none;

    filter:
      drop-shadow(0 0 9px rgba(255, 192, 57, 0.62))
      drop-shadow(0 0 20px rgba(201, 121, 17, 0.26));

    transition:
      transform .3s ease,
      filter .3s ease;
  }

  .logo-link:hover{
    transform:scale(1.04);

    filter:
      drop-shadow(0 0 13px rgba(226, 150, 36, 0.92))
      drop-shadow(0 0 28px rgba(196, 146, 10, 0.44));
  }

  /* =====================================================
     BANNER
  ===================================================== */

  .banner-frame{
    position:relative;
    z-index:3;

    overflow:hidden;

    padding:2px;

    border-radius:18px;

    background:
      linear-gradient(
        135deg,
        #ffffff 0%,
        #e7a71d 28%,
        #a36c07 58%,
        #ffffff 78%,
        #e69721 100%
      );

    background-size:220% 220%;

    box-shadow:
      0 0 14px rgba(255,255,255,.16),
      0 0 28px rgba(255, 169, 57, 0.24),
      0 14px 28px rgba(0,0,0,.42);

    animation:bannerBorder 6s ease infinite;
  }

  .banner-frame::before{
    content:"";

    position:absolute;
    top:-90%;
    bottom:-90%;
    left:-45%;
    z-index:2;

    width:25%;

    pointer-events:none;

    background:
      linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.05),
        rgba(255,255,255,.48),
        transparent
      );

    transform:skewX(-22deg);

    animation:bannerSweep 5s linear infinite;
  }

  .banner-inner{
    position:relative;
    overflow:hidden;

    border-radius:16px;

    background:#100802;
  }

  .banner-inner amp-img,
  .banner-inner img{
    display:block;
    width:100%;
  }

  .banner-frame:hover{
    animation:bannerBlink .75s ease-in-out infinite alternate;
  }

  /* =====================================================
     BUTTON GROUP
  ===================================================== */

  .button-group{
    position:relative;
    z-index:3;

    display:flex;
    flex-direction:column;
    gap:13px;

    margin-top:21px;
  }

  .btn{
    position:relative;
    isolation:isolate;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    min-height:58px;
    padding:14px 18px;

    border-radius:14px;

    font-size:15px;
    font-weight:900;
    letter-spacing:1.3px;
    line-height:1.3;
    text-align:center;
    text-decoration:none;
    text-transform:uppercase;

    transition:
      transform .28s ease,
      filter .28s ease,
      box-shadow .28s ease,
      border-color .28s ease;
  }

  /* Lapisan halus tanpa garis sudut */
  .btn::before{
    content:"";

    position:absolute;
    inset:3px;
    z-index:1;

    border:1px solid rgba(255,255,255,.10);
    border-radius:11px;

    pointer-events:none;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.04),
        transparent 45%,
        rgba(0,0,0,.05)
      );
  }

  .btn::after{
    content:"";

    position:absolute;
    top:-90%;
    bottom:-90%;
    left:-50%;
    z-index:2;

    width:30%;

    pointer-events:none;

    background:
      linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.08),
        rgba(255,255,255,.46),
        transparent
      );

    transform:skewX(-22deg);

    animation:buttonLaser 4.8s linear infinite;
  }

  .btn > span{
    position:relative;
    z-index:3;
  }

  .btn-daftar{
    color:#04170d;

    border:1px solid rgba(255,255,255,.90);

    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(255,255,255,.62),
        transparent 44%
      ),
      linear-gradient(
        100deg,
        #543c07 0%,
        #c7950b 35%,
        #e7a71d 68%,
        #a0710c 100%
      );

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.88),
      inset 0 -10px 20px rgba(88, 60, 0, 0.24),
      0 0 18px rgba(255,255,255,.22),
      0 0 30px rgba(255, 192, 57, 0.45),
      0 13px 28px rgba(0,0,0,.38);
  }

  .btn-login{
    color:#dcffea;

    border:1px solid rgba(233, 152, 32, 0.5);

    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(255, 186, 57, 0.14),
        transparent 49%
      ),
      linear-gradient(
        155deg,
        #4b300d 0%,
        #281a06 50%,
        #0b0801 100%
      );

    text-shadow:
      0 0 9px rgba(238, 165, 29, 0.6);

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 0 22px rgba(245, 176, 26, 0.07),
      0 0 22px rgba(241, 177, 37, 0.17),
      0 13px 28px rgba(0,0,0,.38);
  }

  .btn:hover{
    transform:translateY(-3px);

    filter:brightness(1.12);

    border-color:#ffffff;

    box-shadow:
      inset 0 0 26px rgba(255,255,255,.12),
      0 0 34px rgba(233, 152, 32, 0.5),
      0 17px 34px rgba(0,0,0,.52);
  }

  .btn:active{
    transform:translateY(0) scale(.99);
  }

  /* =====================================================
     COPYRIGHT
  ===================================================== */

  .copyright{
    position:relative;
    z-index:3;

    margin:19px 0 0;
    padding-top:14px;

    color:#b8954b;

    border-top:1px solid rgba(255, 186, 57, 0.15);

    font-size:10px;
    line-height:1.7;
    letter-spacing:.25px;
    text-align:center;
  }

  .copyright a{
    color:#fff6dc;

    font-weight:800;
    text-decoration:none;

    text-shadow:
      0 0 7px rgba(255, 202, 57, 0.46);
  }

  /* =====================================================
     ANIMATIONS
  ===================================================== */

  @keyframes reactorBorder{
    0%,
    100%{
      background-position:0% 50%;
    }

    50%{
      background-position:100% 50%;
    }
  }

  @keyframes bannerBorder{
    0%,
    100%{
      background-position:0% 50%;
    }

    50%{
      background-position:100% 50%;
    }
  }

  @keyframes panelLaser{
    0%{
      left:-55%;
      opacity:0;
    }

    15%{
      opacity:.70;
    }

    100%{
      left:135%;
      opacity:0;
    }
  }

  @keyframes bannerSweep{
    0%{
      left:-45%;
      opacity:0;
    }

    18%{
      opacity:.82;
    }

    100%{
      left:135%;
      opacity:0;
    }
  }

  @keyframes buttonLaser{
    0%{
      left:-50%;
      opacity:0;
    }

    18%{
      opacity:.78;
    }

    100%{
      left:135%;
      opacity:0;
    }
  }

  @keyframes bannerBlink{
    0%{
      filter:
        brightness(1)
        drop-shadow(0 0 6px rgba(255, 176, 57, 0.34));
    }

    100%{
      filter:
        brightness(1.45)
        drop-shadow(0 0 20px #e7a71d)
        drop-shadow(0 0 36px #a36c07);
    }
  }

  /* =====================================================
     MOBILE
  ===================================================== */

  @media(max-width:380px){
    .page-wrapper{
      padding:15px 10px;
    }

    .silver-frame{
      border-radius:20px;
    }

    .silver-frame::before{
      border-radius:22px;
    }

    .main-panel{
      padding:23px 14px 18px;
      border-radius:18px;
    }

    .logo-section{
      padding-bottom:19px;
    }

    .banner-frame{
      border-radius:15px;
    }

    .banner-inner{
      border-radius:13px;
    }

    .btn{
      min-height:53px;
      padding:12px 13px;

      border-radius:12px;

      font-size:13px;
      letter-spacing:1px;
    }

    .btn::before{
      border-radius:9px;
    }
  }

  /* =====================================================
     REDUCED MOTION
  ===================================================== */

  @media(prefers-reduced-motion:reduce){
    .silver-frame,
    .main-panel::after,
    .banner-frame,
    .banner-frame::before,
    .btn::after{
      animation:none;
    }

    .btn,
    .logo-link{
      transition:none;
    }
  }
</style>
